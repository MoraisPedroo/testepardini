<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de Impressão - Hermes Pardini</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Esconde a setinha padrao do <summary> do accordion */
  summary::-webkit-details-marker { display: none; }

  /* Entrada suave da mensagem de retorno */
  @keyframes surgir {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
  }
  .surgir { animation: surgir .28s ease-out; }

  /* Abertura do campo de porta e dos cartoes de download */
  @keyframes descer {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: none; }
  }
  .descer { animation: descer .22s ease-out; }

  /* A logo da Zebra vem com fundo branco: multiply funde no card */
  .funde { mix-blend-mode: multiply; }

  html { scroll-behavior: smooth; }
</style>
</head>
<!-- flex + my-auto centraliza o card sem cortar o topo quando o
     accordion abre e o conteudo passa da altura da tela -->
<body class="flex min-h-screen justify-center bg-slate-100 px-4 py-5 font-sans text-slate-800 antialiased">

  <main class="my-auto w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm">

    <!-- Logo e titulo -->
    <header class="mb-5">
      <img src="logopardini.png" alt="Hermes Pardini" class="mx-auto mb-3 h-12 w-12 rounded-xl shadow-sm">
      <h1 class="text-base font-semibold tracking-tight text-slate-900">Teste de Impressão</h1>
      <p class="mt-0.5 text-[11px] text-slate-500">Hermes Pardini</p>
    </header>

    <form id="form" novalidate>

      <!-- Sistema -->
      <fieldset>
        <legend class="mb-1.5 w-full text-[11px] font-semibold uppercase tracking-wider text-slate-400">Sistema</legend>

        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="sistema" value="ZBP" class="peer sr-only" checked>
            <div class="rounded-xl border-2 border-slate-200 bg-white px-3 py-3 transition peer-hover:border-slate-300 peer-checked:border-green-600 peer-checked:bg-green-50 peer-focus-visible:ring-2 peer-focus-visible:ring-green-500 peer-focus-visible:ring-offset-2">
              <img src="browserprint-logo.png" alt="" class="funde mx-auto h-8 w-8 object-contain">
              <span class="mt-1.5 block text-sm font-medium text-slate-800">Browser Print</span>
            </div>
          </label>

          <label class="cursor-pointer">
            <input type="radio" name="sistema" value="GTI" class="peer sr-only">
            <div class="rounded-xl border-2 border-slate-200 bg-white px-3 py-3 transition peer-hover:border-slate-300 peer-checked:border-green-600 peer-checked:bg-green-50 peer-focus-visible:ring-2 peer-focus-visible:ring-green-500 peer-focus-visible:ring-offset-2">
              <img src="gti-logo.png" alt="" class="mx-auto h-8 w-8 object-contain">
              <span class="mt-1.5 block text-sm font-medium text-slate-800">GTI</span>
            </div>
          </label>
        </div>
      </fieldset>

      <!-- Quantidade e porta dividem a linha quando o GTI esta escolhido -->
      <div id="campos" class="mt-4 grid gap-3">
        <div>
          <label for="qt" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">Quantidade</label>
          <input id="qt" type="number" min="1" max="99" value="1"
                 class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-center text-sm tabular-nums outline-none transition focus:border-green-600 focus:ring-2 focus:ring-green-100">
        </div>

        <!-- Porta: so aparece no GTI. No Browser Print fica cravada em 9100. -->
        <div id="campoPorta" class="hidden">
          <label for="porta" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">Porta</label>
          <input id="porta" type="number" min="1" max="65535" value="8080"
                 class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-center text-sm tabular-nums outline-none transition focus:border-green-600 focus:ring-2 focus:ring-green-100">
        </div>
      </div>

      <!-- Acoes -->
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button type="button" data-linguagem="ZPL"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-b from-green-500 to-green-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-green-600 hover:to-green-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 active:scale-[0.97] disabled:cursor-wait disabled:opacity-60">
          <svg class="girador hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
          </svg>
          <span>Enviar ZPL</span>
        </button>

        <button type="button" data-linguagem="EPL"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-b from-green-500 to-green-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-green-600 hover:to-green-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 active:scale-[0.97] disabled:cursor-wait disabled:opacity-60">
          <svg class="girador hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
          </svg>
          <span>Enviar EPL</span>
        </button>
      </div>

      <!-- Altura reservada: a mensagem entra sem empurrar o card -->
      <p id="mensagem" class="mt-3 min-h-[2.25rem] text-[13px] leading-snug" role="status" aria-live="polite"></p>
    </form>

    <!-- Downloads -->
    <div class="mt-2 border-t border-slate-200 pt-5">
      <a href="downloads/DPPrinterSetup.exe" download
         class="flex items-center justify-center gap-2.5 rounded-xl bg-gradient-to-b from-slate-800 to-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-md transition hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-slate-700 focus:ring-offset-2 active:translate-y-0 active:scale-[0.98]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-6L12 15m0 0l4.5-4.5M12 15V3"/>
        </svg>
        Download DPPrinter
      </a>

      <details id="proxys" class="mt-3">
        <summary class="cursor-pointer list-none text-[11px] text-slate-400 transition hover:text-slate-600">
          Baixar proxys antigos
        </summary>

        <div id="cartoesProxy" class="mt-3 grid grid-cols-2 gap-3">
          <a href="downloads/zebra-browser-print.exe" download
             class="group rounded-xl border border-slate-200 bg-white px-3 py-3.5 transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md">
            <img src="browserprint-logo.png" alt="" class="funde mx-auto h-9 w-9 object-contain transition group-hover:scale-105">
            <span class="mt-2 block text-xs font-semibold text-slate-700">Browser Print</span>
            <span class="mt-0.5 block text-[11px] text-slate-400">Zebra</span>
          </a>

          <a href="downloads/GTI%20Printer%20Proxy%203%20Pardini.exe" download
             class="group rounded-xl border border-slate-200 bg-white px-3 py-3.5 transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md">
            <img src="gti-logo.png" alt="" class="mx-auto h-9 w-9 object-contain transition group-hover:scale-105">
            <span class="mt-2 block text-xs font-semibold text-slate-700">GTI</span>
            <span class="mt-0.5 block text-[11px] text-slate-400">Printer Proxy</span>
          </a>
        </div>
      </details>
    </div>

  </main>

<script>
(function () {
  'use strict';

  /* Marca a versao no console: serve para conferir, na maquina do usuario,
   * se a pagina carregada e a atual ou uma copia velha em cache.        */
  var VERSAO = '2026-09-03b (card em uma tela so)';
  console.log('Teste de Impressao - versao ' + VERSAO);

  var PAYLOADS = {
    /* EPL mantido do sistema legado. */
    EPL: function (op) {
      return 'N\n' +
             'R30,10\n' +
             'D8\n' +
             'A210,0,0,1,1,1,N,"TESTE TH"\n' +
             'B285,65,0,2,2,4,70,N,"200558309501"\n' +
             'A210,20,0,1,1,1,N,"200-5583095-01  14/10/22 16:28"\n' +
             'A210,35,0,1,1,1,N,"CONV: 9999"\n' +
             'A330,35,0,1,1,1,N,"PED.CONV: 21077"\n' +
             'A210,50,0,1,1,1,N,"LINHA VERMELHA"\n' +
             'A420,50,0,1,1,1,N,"DN 09/12/60"\n' +
             'A195,220,3,1,1,1,R,"   NTO"\n' +
             'A210,143,0,1,1,1,N,"SANGUE TOTAL EM EDTA"\n' +
             'A210,158,0,1,1,1,N,"PLAQUETAS - EDTA"\n' +
             'A210,173,0,1,1,1,N,"VOL: 1000ul"\n' +
             'A450,173,0,1,1,1,N,"(REFRIG.)"\n' +
             'A210,188,0,1,1,1,N,"HG "\n' +
             'A210,206,0,1,1,1,N,""\n' +
             'P' + op.qt + '\n' +
             'N\n';
    },

    /* ZPL: etiqueta de teste com moldura, dados do envio e codigo de
     * barras. Mesma area do legado (400x240 dots) para nao estourar o
     * material. ^CI28 = UTF-8, necessario para os acentos.            */
    ZPL: function (op) {
      return '^XA\n' +
             '^CI28\n' +
             '^MMT\n' +
             '^PW400\n' +
             '^LL240\n' +
             '^LH0,0\n' +
             '^FO8,8^GB384,224,3^FS\n' +
             '^FO24,24^A0N,30,30^FDTESTE DE IMPRESSÃO^FS\n' +
             '^FO24,60^GB352,3,3^FS\n' +
             '^FO24,74^A0N,24,24^FDHermes Pardini^FS\n' +
             '^FO24,102^A0N,20,20^FDSistema: ' + op.sistema + '^FS\n' +
             '^FO24,126^A0N,20,20^FDPorta: ' + op.porta + '   Etiquetas: ' + op.qt + '^FS\n' +
             '^BY2,3,42\n' +
             '^FO70,152^BCN,42,Y,N,N^FD200558309501^FS\n' +
             '^PQ' + op.qt + ',0,1,Y\n' +
             '^XZ\n';
    }
  };

  var PORTA_ZBP = 9100;   // cravada para o Browser Print

  var campoPorta = document.getElementById('campoPorta');
  var inpPorta   = document.getElementById('porta');
  var inpQt      = document.getElementById('qt');
  var mensagem   = document.getElementById('mensagem');
  var radios     = document.querySelectorAll('input[name="sistema"]');
  var botoes     = document.querySelectorAll('button[data-linguagem]');
  var campos     = document.getElementById('campos');
  var proxys     = document.getElementById('proxys');
  var cartoes    = document.getElementById('cartoesProxy');

  function sistema() {
    var marcado = document.querySelector('input[name="sistema"]:checked');
    return marcado ? marcado.value : 'ZBP';
  }

  /* Reinicia a animacao removendo a classe e forcando um reflow. */
  function animar(el, classe) {
    el.classList.remove(classe);
    void el.offsetWidth;
    el.classList.add(classe);
  }

  function atualizarPorta() {
    var mostrarPorta = sistema() === 'GTI';
    campoPorta.classList.toggle('hidden', !mostrarPorta);
    /* Com a porta a vista os dois campos dividem a linha, e o card
     * mantem a mesma altura nos dois sistemas.                     */
    campos.classList.toggle('grid-cols-2', mostrarPorta);
    if (mostrarPorta) { animar(campoPorta, 'descer'); }
  }

  function quantidade() {
    var q = parseInt(inpQt.value, 10);
    if (isNaN(q) || q < 1) { q = 1; }
    if (q > 99) { q = 99; }
    inpQt.value = String(q);
    return q;
  }

  function mostrar(texto, cor) {
    mensagem.textContent = texto;
    mensagem.className = 'mt-3 min-h-[2.25rem] text-[13px] leading-snug ' + cor;
    animar(mensagem, 'surgir');
  }

  function sucesso(texto) { mostrar(texto, 'font-medium text-green-700'); }
  function erro(texto)    { mostrar(texto, 'text-red-600'); }

  /* Trava os dois botoes e gira o spinner apenas no que foi clicado. */
  function travar(estado, botaoAtivo) {
    Array.prototype.forEach.call(botoes, function (b) {
      b.disabled = estado;
      var girador = b.querySelector('.girador');
      if (girador) {
        girador.classList.toggle('hidden', !(estado && b === botaoAtivo));
      }
    });
  }

  function falha(msg) {
    var e = new Error(msg);
    e.tratado = true;
    return e;
  }

  /* Nos dois servicos "nenhuma impressora selecionada" chega como um JSON
   * com success:false, e o sucesso pode vir com o corpo vazio.        */
  function conferirRetorno(texto) {
    if (!texto) { return; }

    var j = null;
    try { j = JSON.parse(texto); } catch (e) { return; }

    if (j && j.success === false) {
      if (j.error === 'NO_PRINTER_SELECTED') {
        throw falha('IMPRESSORA NÃO DEFINIDA. Selecione a impressora no DP Printer.');
      }
      throw falha(j.message || j.error || 'O DP Printer recusou o trabalho.');
    }
  }

  /* O DPPrinter roda dois servicos, um por porta, cada um com sua rota:
   *   Browser Print -> 9100         GET  /default  +  POST /write { device, data }
   *   GTI           -> porta proxy  POST /gti-printer-proxy/api/printer/print
   *
   * Content-Type text/plain mantem a requisicao "simples" (sem preflight)
   * e faz o Flask entregar o corpo cru, sem tratar como formulario.   */
  async function enviar(linguagem, botaoAtivo) {
    var qt          = quantidade();
    var eZBP        = sistema() === 'ZBP';
    var porta       = eZBP ? PORTA_ZBP : parseInt(inpPorta.value, 10);
    var nomeSistema = eZBP ? 'Browser Print' : 'GTI';
    var base        = 'http://127.0.0.1:' + porta;

    if (!porta || porta < 1 || porta > 65535) {
      erro('Porta inválida. Use um número entre 1 e 65535.');
      inpPorta.focus();
      return;
    }

    var payload = PAYLOADS[linguagem]({ qt: qt, porta: porta, sistema: nomeSistema });

    travar(true, botaoAtivo);
    mostrar('Enviando...', 'text-slate-500');

    try {
      var envio;

      if (eZBP) {
        var impressora = null;
        try {
          var consulta = await fetch(base + '/default?type=printer');
          if (consulta.ok) { impressora = await consulta.json(); }
        } catch (e) {
          throw falha('O DP Printer não respondeu na porta ' + porta + '. Verifique se ele está aberto.');
        }

        envio = await fetch(base + '/write', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ device: impressora, data: payload })
        });

      } else {
        try {
          envio = await fetch(base + '/gti-printer-proxy/api/printer/print', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: payload
          });
        } catch (e) {
          throw falha('O proxy GTI não respondeu na porta ' + porta + '. Confira a PORTA PROXY no DP Printer.');
        }
      }

      if (envio.status === 404) {
        throw falha('A porta ' + porta + ' não tem o serviço do ' + nomeSistema + '. Confira a PORTA PROXY no DP Printer.');
      }

      if (envio.status === 409) {
        throw falha('IMPRESSORA NÃO DEFINIDA. Selecione a impressora no DP Printer.');
      }

      if (!envio.ok) {
        throw falha('O ' + nomeSistema + ' respondeu HTTP ' + envio.status + ' e não imprimiu.');
      }

      var texto = '';
      try { texto = await envio.text(); } catch (e) { texto = ''; }
      conferirRetorno(texto);

      sucesso('Impressão enviada na porta ' + porta + ' em ' + linguagem +
              ' pelo sistema ' + nomeSistema + '.');

    } catch (e) {
      erro(e.tratado ? e.message : 'Erro inesperado: ' + e.message);
    } finally {
      travar(false, botaoAtivo);
    }
  }

  Array.prototype.forEach.call(radios, function (r) {
    r.addEventListener('change', atualizarPorta);
  });

  Array.prototype.forEach.call(botoes, function (b) {
    b.addEventListener('click', function () {
      enviar(b.getAttribute('data-linguagem'), b);
    });
  });

  /* O card cabe na tela; abrir os proxys e o unico caso em que a pagina
   * cresce — entao rolamos ate os cartoes para eles ficarem a vista.  */
  proxys.addEventListener('toggle', function () {
    if (!this.open) { return; }
    animar(cartoes, 'descer');
    setTimeout(function () {
      /* Ate o fim da pagina, e nao so ate os cartoes: assim a base do
       * card aparece inteira, sem cortar a margem de baixo.        */
      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    }, 60);
  });

  atualizarPorta();
})();
</script>
</body>
</html>
