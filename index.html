<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de Impressão - Hermes Pardini</title>
<link rel="icon" type="image/png" href="logopardini.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Esconde a setinha padrao do <summary> do accordion */
  summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 font-sans text-slate-800 antialiased">

  <main class="mx-auto w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

    <!-- Logo e titulo -->
    <header class="mb-8 text-center">
      <img src="logopardini.png" alt="Hermes Pardini" class="mx-auto mb-4 h-16 w-16 rounded-xl">
      <h1 class="text-lg font-semibold text-slate-900">Teste de Impressão - Hermes Pardini</h1>
    </header>

    <!-- Formulario -->
    <form id="form" novalidate>

      <label for="qt" class="block text-sm font-medium text-slate-700">Quantidade de etiquetas</label>
      <input id="qt" type="number" min="1" max="99" value="1"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-green-600 focus:ring-1 focus:ring-green-600">

      <fieldset class="mt-5">
        <legend class="text-sm font-medium text-slate-700">Sistema</legend>

        <label class="mt-2 flex cursor-pointer items-center gap-2">
          <input type="radio" name="sistema" value="ZBP" class="h-4 w-4 accent-green-600" checked>
          <span class="text-sm text-slate-700">Teste Pardini (ZBP)</span>
        </label>

        <label class="mt-2 flex cursor-pointer items-center gap-2">
          <input type="radio" name="sistema" value="GTI" class="h-4 w-4 accent-green-600">
          <span class="text-sm text-slate-700">GTI</span>
        </label>
      </fieldset>

      <!-- Porta: so aparece no GTI. No ZBP fica cravada em 9100 nos bastidores. -->
      <div id="campoPorta" class="mt-4 hidden">
        <label for="porta" class="block text-sm font-medium text-slate-700">Porta</label>
        <input id="porta" type="number" min="1" max="65535" value="9100"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-green-600 focus:ring-1 focus:ring-green-600">
      </div>

      <div class="mt-6 grid grid-cols-2 gap-3">
        <button type="button" data-linguagem="ZPL"
                class="rounded-lg bg-green-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-60">
          Enviar ZPL
        </button>
        <button type="button" data-linguagem="EPL"
                class="rounded-lg bg-green-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-60">
          Enviar EPL
        </button>
      </div>

      <p id="mensagem" class="mt-4 hidden text-center text-sm leading-relaxed" role="status" aria-live="polite"></p>
    </form>

    <!-- Downloads -->
    <div class="mt-8 border-t border-slate-200 pt-6">
      <a href="downloads/DPPrinterSetup.exe" download
         class="block rounded-lg bg-slate-900 px-4 py-3 text-center text-sm font-semibold text-white transition hover:bg-slate-800">
        Download DPPrinter
      </a>

      <details class="mt-4 text-center">
        <summary class="cursor-pointer list-none text-xs text-slate-500 underline underline-offset-2 hover:text-slate-700">
          Baixar proxys antigos
        </summary>
        <div class="mt-3 grid gap-2">
          <a href="downloads/zebra-browser-print.exe" download
             class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
            Download Browser Print
          </a>
          <a href="downloads/GTI%20Printer%20Proxy%203%20Pardini.exe" download
             class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
            Download WCPP
          </a>
        </div>
      </details>
    </div>

  </main>

<script>
(function () {
  'use strict';

  /* Marca a versao no console: serve para conferir, na maquina do usuario,
   * se a pagina carregada e a atual ou uma copia velha em cache.        */
  var VERSAO = '2026-08-27 (API /default + /write)';
  console.log('Teste de Impressao - versao ' + VERSAO);

  /* Payloads mantidos do sistema legado. */
  var PAYLOADS = {
    EPL: function (qt) {
      return 'N\n' +
             'R30,10\n' +
             'D8\n' +
             'A210,0,0,1,1,1,N,"TESTE TH"\n' +
             'B285,65,0,2,2,4,70,N,"200558309501"\n' +
             'A210,20,0,1,1,1,N,"200-5583095-01  14/10/22 16:28"\n' +
             'A210,35,0,1,1,1,N,"CONV: 9999"\n' +
             'A330,35,0,1,1,1,N,"PED.CONV: 21077"\n' +
             'A210,50,0,1,1,1,N,"LINHA VERMELHA"\n' +
             'A420,50,0,1,1,1,N,"DN 09/12/60"\n' +
             'A195,220,3,1,1,1,R,"   NTO"\n' +
             'A210,143,0,1,1,1,N,"SANGUE TOTAL EM EDTA"\n' +
             'A210,158,0,1,1,1,N,"PLAQUETAS - EDTA"\n' +
             'A210,173,0,1,1,1,N,"VOL: 1000ul"\n' +
             'A450,173,0,1,1,1,N,"(REFRIG.)"\n' +
             'A210,188,0,1,1,1,N,"HG "\n' +
             'A210,206,0,1,1,1,N,""\n' +
             'P' + qt + '\n' +
             'N\n';
    },
    ZPL: function (qt) {
      return '^XA^MMT^PW400^LL240^LS0' +
             '^FT38,221^A0N,40,41^FH\\^CI28^FDTeste de Impressão^FS^CI27' +
             '^PQ' + qt + ',0,1,Y^XZ';
    }
  };

  var PORTA_ZBP = 9100;   // cravada para o Teste Pardini

  var campoPorta = document.getElementById('campoPorta');
  var inpPorta   = document.getElementById('porta');
  var inpQt      = document.getElementById('qt');
  var mensagem   = document.getElementById('mensagem');
  var radios     = document.querySelectorAll('input[name="sistema"]');
  var botoes     = document.querySelectorAll('button[data-linguagem]');

  function sistema() {
    var marcado = document.querySelector('input[name="sistema"]:checked');
    return marcado ? marcado.value : 'ZBP';
  }

  /* O campo de porta so existe na tela quando o sistema e o GTI. */
  function atualizarPorta() {
    campoPorta.classList.toggle('hidden', sistema() !== 'GTI');
  }

  function quantidade() {
    var q = parseInt(inpQt.value, 10);
    if (isNaN(q) || q < 1) { q = 1; }
    if (q > 99) { q = 99; }
    inpQt.value = String(q);
    return q;
  }

  function mostrar(texto, cor) {
    mensagem.textContent = texto;
    mensagem.className = 'mt-4 text-center text-sm leading-relaxed ' + cor;
  }

  function sucesso(texto) { mostrar(texto, 'text-green-700 font-medium'); }
  function erro(texto)    { mostrar(texto, 'text-red-600'); }

  function travar(estado) {
    Array.prototype.forEach.call(botoes, function (b) { b.disabled = estado; });
  }

  /* Erro com mensagem ja pronta para o usuario final. */
  function falha(msg) {
    var e = new Error(msg);
    e.tratado = true;
    return e;
  }

  /* O DPPrinter (e o Browser Print) expoem a mesma API HTTP local:
   *   GET  /default?type=printer  -> dados da impressora padrao
   *   POST /write                 -> { device, data }
   * Usamos Content-Type text/plain de proposito: mantem a requisicao
   * "simples" e evita o preflight de CORS.                            */
  async function enviar(linguagem) {
    var qt          = quantidade();
    var eZBP        = sistema() === 'ZBP';
    var porta       = eZBP ? PORTA_ZBP : parseInt(inpPorta.value, 10);
    var nomeSistema = eZBP ? 'Teste Pardini' : 'GTI';
    var base        = 'http://127.0.0.1:' + porta;

    if (!porta || porta < 1 || porta > 65535) {
      erro('Porta inválida. Informe um número entre 1 e 65535.');
      inpPorta.focus();
      return;
    }

    travar(true);
    mostrar('Enviando...', 'text-slate-500');

    try {
      /* 1) Descobre a impressora padrao */
      var resposta;
      try {
        resposta = await fetch(base + '/default?type=printer');
      } catch (e) {
        throw falha('O ' + nomeSistema + ' não respondeu em 127.0.0.1:' + porta +
                    '. Confira se o programa está instalado e em execução (ícone na bandeja ' +
                    'do Windows) e se a porta está correta. Se não estiver instalado, ' +
                    'baixe pelos botões abaixo.');
      }

      if (resposta.status === 404) {
        throw falha('O serviço na porta ' + porta + ' respondeu, mas não reconhece a rota /default. ' +
                    'Confirme se a porta é a do ' + nomeSistema + ' e se a versão está atualizada.');
      }
      if (!resposta.ok) {
        throw falha('O ' + nomeSistema + ' respondeu HTTP ' + resposta.status + ' ao consultar a impressora padrão.');
      }

      var impressora = null;
      try { impressora = await resposta.json(); } catch (e) { impressora = null; }

      if (!impressora || !impressora.uid) {
        throw falha('IMPRESSORA NÃO DEFINIDA — nenhuma impressora padrão está configurada no ' +
                    nomeSistema + '. Abra o programa e selecione a impressora.');
      }

      /* 2) Envia o trabalho */
      var envio;
      try {
        envio = await fetch(base + '/write', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ device: impressora, data: PAYLOADS[linguagem](qt) })
        });
      } catch (e) {
        throw falha('A conexão com o ' + nomeSistema + ' caiu durante o envio para 127.0.0.1:' + porta + '.');
      }

      if (envio.status === 404) {
        throw falha('O serviço na porta ' + porta + ' não reconhece a rota /write. ' +
                    'A versão instalada do ' + nomeSistema + ' parece incompatível.');
      }
      if (!envio.ok) {
        throw falha('Falha ao enviar para a impressora: HTTP ' + envio.status + '.');
      }

      var retorno = null;
      try { retorno = await envio.json(); } catch (e) { retorno = null; }

      if (retorno && retorno.success === false) {
        throw falha(retorno.error || retorno.message ||
                    'O ' + nomeSistema + ' recusou o trabalho de impressão.');
      }

      sucesso('Impressão enviada na porta ' + porta + ' em ' + linguagem +
              ' pelo sistema ' + nomeSistema + '.');

    } catch (e) {
      erro(e.tratado ? e.message : 'Erro inesperado: ' + e.message);
    } finally {
      travar(false);
    }
  }

  Array.prototype.forEach.call(radios, function (r) {
    r.addEventListener('change', atualizarPorta);
  });

  Array.prototype.forEach.call(botoes, function (b) {
    b.addEventListener('click', function () { enviar(b.getAttribute('data-linguagem')); });
  });

  atualizarPorta();
})();
</script>
</body>
</html>
